<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Store - Light Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Mona Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        gumroad: {
                            bg: '#f4f4f0',
                            pink: '#ff90e8',
                            yellow: '#ffc900',
                            green: '#23a094',
                        }
                    },
                    boxShadow: {
                        'brutal': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'brutal-hover': '6px 6px 0px 0px rgba(0,0,0,1)',
                        'brutal-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f4f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Smooth out transforms */
        .brutal-card, .brutal-btn {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        
        .brutal-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
        }

        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        }

        #toast {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            transform: translateY(150%) scale(0.9);
            opacity: 0;
        }
        #toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body class="text-black font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full max-w-4xl mx-auto px-4 sm:px-6 py-8 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gumroad-pink border-2 border-black rounded-full flex items-center justify-center font-bold text-xl shadow-brutal-sm">
                C
            </div>
            <span class="font-bold text-2xl tracking-tight">CreatorSpace</span>
        </div>
        <button class="font-semibold text-black hover:underline decoration-2 underline-offset-4">
            Login
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-4xl mx-auto px-4 sm:px-6 pb-24">
        
        <!-- Hero Section -->
        <section class="py-12 md:py-20">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
                Digital assets <br/><span class="bg-gumroad-yellow px-2 border-2 border-black inline-block -rotate-1 shadow-brutal">made simple.</span>
            </h1>
            <p class="text-xl md:text-2xl font-medium text-gray-800 max-w-2xl mb-10">
                Discover tools, templates, and courses designed to elevate your creative workflow.
            </p>
            
            <!-- Dynamic Features Section -->
            <div class="flex flex-col sm:flex-row gap-6 mb-10 items-start">
                <!-- URL Parameter Display Section (Hidden by default) -->
                <div id="url-message-container" class="hidden bg-white border-2 border-black rounded-xl p-6 shadow-brutal flex-1 w-full">
                    <p class="font-bold text-lg text-gray-600 mb-1">Message from URL ('r'):</p>
                    <p id="url-message-text" class="text-2xl font-extrabold text-gumroad-green break-all"></p>
                </div>

                <!-- Secure API Test Section -->
                <div class="bg-white border-2 border-black rounded-xl p-6 shadow-brutal flex-1 w-full">
                    <h3 class="font-bold text-xl mb-4">Secure API Test</h3>
                    <button onclick="getEncryptedData()" class="brutal-btn bg-[#b3b3fa] border-2 border-black text-black px-4 py-2 rounded-lg font-bold shadow-brutal-sm hover:bg-[#9b9bf8] mb-4 text-sm">
                        Fetch Encrypted Token
                    </button>
                    <p class="font-bold text-sm text-gray-700 mb-2">Status: <span id="status" class="font-normal text-black">Waiting...</span></p>
                    <p class="font-bold text-sm text-gray-700 mb-1">Token:</p>
                    <code id="tokenDisplay" class="block bg-gumroad-bg border-2 border-black p-2 rounded text-xs break-all">None</code>
                </div>
            </div>
        </section>

        <!-- Products List -->
        <section id="products-container" class="flex flex-col gap-6">
            <!-- Populated by JavaScript -->
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t-2 border-black bg-white py-10 mt-auto">
        <div class="max-w-4xl mx-auto px-6 text-center font-semibold text-gray-600">
            <p>&copy; 2026 CreatorSpace. Built for creators.</p>
        </div>
    </footer>

    <!-- Brutalist Toast Notification -->
    <div class="fixed bottom-8 left-0 right-0 flex justify-center pointer-events-none z-50 px-4">
        <div id="toast" class="bg-white border-2 border-black px-6 py-4 rounded-xl shadow-brutal font-bold text-black flex items-center gap-3 pointer-events-auto max-w-md w-full sm:w-auto">
            <div class="w-8 h-8 bg-gumroad-green border-2 border-black rounded-full flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <span id="toast-message" class="text-lg">Checkout opened!</span>
        </div>
    </div>

    <script>
        // Check for URL parameters and initialize features
        document.addEventListener('DOMContentLoaded', () => {
            // --- Feature 1: Read the URL Parameter ---
            const params = new URLSearchParams(window.location.search);
            const rValue = params.get('r');

            if (rValue) {
                const messageContainer = document.getElementById('url-message-container');
                const messageText = document.getElementById('url-message-text');
                
                // URLSearchParams.get() handles decoding automatically, matching the snippet logic
                messageText.textContent = rValue;
                messageContainer.classList.remove('hidden');
            }
        });

        // --- Feature 2: Call the Serverless API ---
        async function getEncryptedData() {
            const statusEl = document.getElementById('status');
            const tokenEl = document.getElementById('tokenDisplay');

            statusEl.textContent = "Fetching from /api/encrypt...";
            tokenEl.textContent = "None";

            try {
                // Call the Vercel backend function
                const response = await fetch('/api/encrypt');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                statusEl.textContent = "Success!";
                tokenEl.textContent = data.token;
                
            } catch (error) {
                console.error("Failed to fetch token:", error);
                statusEl.textContent = "Error fetching token. Check the browser console.";
            }
        }

        // Product Data
        const products = [
            {
                id: 1,
                title: "Supercharge UI Kit",
                description: "Over 200+ perfectly crafted components. Build interfaces at lightning speed with our comprehensive design system.",
                price: "$49",
                imageBg: "bg-gumroad-pink",
                emoji: "🎨"
            },
            {
                id: 2,
                title: "Freelancer's Notion Dashboard",
                description: "Track projects, invoices, and clients in one place. The ultimate operating system for independent creators.",
                price: "$29",
                imageBg: "bg-gumroad-yellow",
                emoji: "📓"
            },
            {
                id: 3,
                title: "Code Snippet Library",
                description: "100+ reusable JavaScript and CSS snippets. Stop rewriting the same boilerplate code over and over again.",
                price: "$15",
                imageBg: "bg-[#b3b3fa]", 
                emoji: "💻"
            },
            {
                id: 4,
                title: "Creator Marketing Guide",
                description: "A 50-page ebook detailing how to launch products, build an audience, and scale your creative business.",
                price: "$39",
                imageBg: "bg-gumroad-green",
                emoji: "📈"
            }
        ];

        // Render Products
        const container = document.getElementById('products-container');

        products.forEach(product => {
            const productHTML = `
                <div class="brutal-card bg-white border-2 border-black rounded-2xl p-4 sm:p-6 flex flex-col sm:flex-row gap-5 items-start sm:items-center justify-between shadow-brutal group cursor-pointer">
                    
                    <!-- Thumbnail & Content -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5 sm:gap-6 flex-grow w-full">
                        <div class="w-full sm:w-24 h-40 sm:h-24 ${product.imageBg} border-2 border-black rounded-xl flex items-center justify-center text-4xl sm:text-3xl flex-shrink-0 shadow-brutal-sm">
                            ${product.emoji}
                        </div>
                        <div class="flex-grow">
                            <h3 class="font-bold text-2xl mb-2">${product.title}</h3>
                            <p class="text-gray-700 font-medium leading-relaxed max-w-xl text-sm sm:text-base">${product.description}</p>
                        </div>
                    </div>

                    <!-- Price & CTA -->
                    <div class="flex flex-row sm:flex-col items-center sm:items-end justify-between sm:justify-center w-full sm:w-auto gap-4 mt-2 sm:mt-0 pt-4 sm:pt-0 border-t-2 sm:border-t-0 border-black sm:border-none">
                        <div class="text-2xl font-extrabold">${product.price}</div>
                        
                        <button onclick="handlePurchase(event, '${product.title.replace(/'/g, "\\'")}')" class="brutal-btn bg-gumroad-pink border-2 border-black text-black px-6 py-3 rounded-lg font-bold text-lg shadow-brutal w-full sm:w-auto whitespace-nowrap hover:bg-[#ffa9ed]">
                            I want this
                        </button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', productHTML);
        });

        // Toast Notification Logic
        let toastTimeout;
        function handlePurchase(event, productName) {
            // Prevent the card click if we click the button directly
            event.stopPropagation();
            
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = `Checkout: ${productName}`;
            
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    </script>
</body>
</html>
