<!DOCTYPE html><html>
<head>
    <meta charset="UTF-8">
    <title>Gumroad Fetch Debugger</title><style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
    }

    button {
        padding: 10px 18px;
        cursor: pointer;
    }

    #status {
        margin-top: 20px;
        padding: 12px;
        background: #f3f3f3;
        white-space: pre-wrap;
    }

    pre {
        background: #111;
        color: #eee;
        padding: 15px;
        overflow: auto;
        white-space: pre-wrap;
    }

    .error {
        color: #b00020;
    }

    .success {
        color: #087f23;
    }
</style>

</head><body><h2>Gumroad Product Debugger</h2>

<button id="getData">
    Get Product Data
</button>

<div id="status">
    Click the button to start.
</div>

<h3>Result</h3>
<pre id="result"></pre>

<h3>Response Preview</h3>
<pre id="responsePreview"></pre>

<script>
    const button = document.getElementById("getData");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const responsePreview = document.getElementById("responsePreview");

    const url =
        "https://emh1.gumroad.com/l/cbiam?referrer=track_nun7ttodba";

    button.addEventListener("click", async () => {

        status.className = "";
        result.textContent = "";
        responsePreview.textContent = "";

        status.textContent =
            "Starting request...\n" +
            "URL: " + url;

        try {

            // ------------------------------------------------
            // 1. Make request
            // ------------------------------------------------

            console.log("Fetching:", url);

            const response = await fetch(url, {
                method: "GET",
                mode: "cors"
            });

            // ------------------------------------------------
            // 2. Display HTTP information
            // ------------------------------------------------

            let headerText = "";

            for (const [key, value] of response.headers.entries()) {
                headerText += `${key}: ${value}\n`;
            }

            status.textContent =
                "Request completed!\n\n" +
                "URL: " + response.url + "\n" +
                "Status: " + response.status + "\n" +
                "Status Text: " + response.statusText + "\n" +
                "Type: " + response.type + "\n" +
                "OK: " + response.ok + "\n\n" +
                "Response Headers:\n" +
                headerText;

            // ------------------------------------------------
            // 3. Check HTTP status
            // ------------------------------------------------

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status} ${response.statusText}`
                );
            }

            // ------------------------------------------------
            // 4. Read HTML
            // ------------------------------------------------

            const html = await response.text();

            responsePreview.textContent =
                html.substring(0, 5000);

            console.log("Response length:", html.length);

            // ------------------------------------------------
            // 5. Find data-page
            // ------------------------------------------------

            const match = html.match(
                /<div\s+id=["']app["'][^>]*data-page=["'](.*?)["']/s
            );

            if (!match) {
                throw new Error(
                    "The request succeeded, but the <div id=\"app\" data-page=\"...\"> element was not found."
                );
            }

            console.log("data-page found.");

            // ------------------------------------------------
            // 6. Decode HTML entities
            // ------------------------------------------------

            const textarea = document.createElement("textarea");

            textarea.innerHTML = match[1];

            const dataPage = textarea.value;

            console.log(
                "data-page length:",
                dataPage.length
            );

            // ------------------------------------------------
            // 7. Parse JSON
            // ------------------------------------------------

            let data;

            try {
                data = JSON.parse(dataPage);
            } catch (jsonError) {

                console.error(
                    "JSON parsing failed:",
                    jsonError
                );

                throw new Error(
                    "data-page was found, but it is not valid JSON.\n\n" +
                    jsonError.message
                );
            }

            // ------------------------------------------------
            // 8. Get product
            // ------------------------------------------------

            if (!data.props) {
                throw new Error(
                    "JSON was parsed, but 'props' was not found."
                );
            }

            if (!data.props.product) {
                throw new Error(
                    "JSON was parsed, but 'props.product' was not found."
                );
            }

            const product = data.props.product;

            // ------------------------------------------------
            // 9. Extract fields
            // ------------------------------------------------

            const productResult = {
                title: product.name,
                price_cents: product.price_cents,
                currency: product.currency_code,
                permalink: product.permalink,
                url: product.long_url,
                description: product.description_html,
                published: product.is_published,
                product_id: product.id,
                seller: product.seller?.name,
                category: product.native_type,
                is_physical: product.is_physical,
                sales_count: product.sales_count,
                cover_image: product.covers?.[0]?.url
            };

            // ------------------------------------------------
            // 10. Display result
            // ------------------------------------------------

            result.textContent =
                JSON.stringify(
                    productResult,
                    null,
                    2
                );

            status.className = "success";

            status.textContent +=
                "\n\nSuccessfully extracted product data.";

        } catch (error) {

            console.error("REQUEST ERROR:", error);

            status.className = "error";

            status.textContent +=
                "\n\nERROR:\n" +
                error.name +
                "\n" +
                error.message;

            // ------------------------------------------------
            // Extra CORS diagnosis
            // ------------------------------------------------

            if (error instanceof TypeError) {

                status.textContent +=
                    "\n\nPossible cause:\n" +
                    "The browser blocked the cross-origin request " +
                    "(CORS).\n\n" +
                    "Open the browser DevTools → Console and Network " +
                    "tabs for the exact browser error.";
            }
        }
    });
</script>

</body>
</html>
